{% extends "base.html" %}
{% block title %}Transcript{% endblock %}
{% block content %}
<div class="transcript-page">
    <div class="player-sticky">
        <div class="player-bar">
            <button id="prev-phrase" class="phrase-btn" type="button" title="Previous phrase">&larr;</button>
            <audio id="player" controls src="/api/recordings/{{ recording.recording_id }}/audio"></audio>
            <button id="next-phrase" class="phrase-btn" type="button" title="Next phrase">&rarr;</button>
            <a href="/api/recordings/{{ recording.recording_id }}/download" class="download-link{% if not txt_ready %} hidden{% endif %}" id="download-link" download title="Download TXT" aria-label="Download TXT">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span class="loader hidden" id="download-loader"></span>
            </a>
            <a href="/" class="back-link" title="Back to recordings" aria-label="Back to recordings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </a>
        </div>
        <div class="player-meta">
            <span id="status"></span>
            <span id="audio-hint" class="audio-hint hidden"></span>
        </div>
    </div>
    {% if recording.comment %}
    <p class="recording-comment">{{ recording.comment }}</p>
    {% endif %}
    <div class="transcript-container" id="transcript"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
window.RECORDING_ID = "{{ recording.recording_id }}";
window.ORIGINAL_FILENAME = "{{ recording.original_filename | e }}";
window.TRANSCRIPT = {{ transcript | tojson | safe }};
window.TXT_READY = {{ txt_ready | tojson }};
</script>
<script src="/static/js/player.js"></script>
{% endblock %}
