{% extends "base.html" %}
{% block title %}Transcript{% endblock %}
{% block content %}
<div class="transcript-page">
    <div class="player-sticky">
        <div class="player-bar">
            <button id="prev-phrase" class="phrase-btn" type="button" title="Previous phrase">&larr;</button>
            <audio id="player" controls src="/api/recordings/{{ recording.recording_id }}/audio"></audio>
            <button id="next-phrase" class="phrase-btn" type="button" title="Next phrase">&rarr;</button>
            <div class="speed-control" id="speed-control">
                <button id="speed-btn" class="phrase-btn speed-btn" type="button" title="Playback speed" aria-haspopup="true" aria-expanded="false">1&times;</button>
                <div class="speed-popup" id="speed-popup">
                    <button type="button" class="speed-option" data-rate="0.75">0.75&times;</button>
                    <button type="button" class="speed-option" data-rate="0.9">0.9&times;</button>
                    <button type="button" class="speed-option" data-rate="1">1&times;</button>
                    <button type="button" class="speed-option" data-rate="1.1">1.1&times;</button>
                    <button type="button" class="speed-option" data-rate="1.25">1.25&times;</button>
                    <button type="button" class="speed-option" data-rate="1.5">1.5&times;</button>
                </div>
            </div>
            <a href="/api/recordings/{{ recording.recording_id }}/download" class="download-link{% if not txt_ready %} hidden{% endif %}" id="download-link" download>
                <span class="download-text">Download TXT</span>
                <span class="loader hidden" id="download-loader"></span>
            </a>
            <a href="/">&larr; Back</a>
        </div>
        <div class="player-meta">
            <span id="status"></span>
            <span id="audio-hint" class="audio-hint hidden"></span>
        </div>
    </div>
    {% if recording.comment %}
    <p class="recording-comment">{{ recording.comment }}</p>
    {% endif %}
    <div class="transcript-container" id="transcript"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
window.RECORDING_ID = "{{ recording.recording_id }}";
window.ORIGINAL_FILENAME = "{{ recording.original_filename | e }}";
window.TRANSCRIPT = {{ transcript | tojson | safe }};
window.TXT_READY = {{ txt_ready | tojson }};
</script>
<script src="/static/js/player.js"></script>
{% endblock %}
