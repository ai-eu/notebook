{% extends "base.html" %}
{% block title %}Transcript{% endblock %}
{% block content %}
<div class="transcript-page">
    <div class="player-sticky">
        <div class="player-bar">
            <button id="prev-phrase" class="phrase-btn" type="button" title="Previous phrase">&larr;</button>
            <audio id="player" controls src="/api/recordings/{{ recording.recording_id }}/audio"></audio>
            <button id="next-phrase" class="phrase-btn" type="button" title="Next phrase">&rarr;</button>
            <a href="/api/recordings/{{ recording.recording_id }}/download" class="download-link" id="download-link" download>
                <span class="download-text">Download TXT</span>
                <span class="loader hidden" id="download-loader"></span>
            </a>
            <a href="/">&larr; Back</a>
        </div>
        <div class="player-meta">
            <span id="status"></span>
        </div>
    </div>
    <div class="transcript-container" id="transcript"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
window.RECORDING_ID = "{{ recording.recording_id }}";
window.ORIGINAL_FILENAME = "{{ recording.original_filename | e }}";
window.TRANSCRIPT = {{ transcript | tojson | safe }};
</script>
<script src="/static/js/player.js"></script>
{% endblock %}
