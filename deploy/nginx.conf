# Template for a fresh install. On an existing server keep the Certbot-managed
# SSL blocks and sync only server_name / proxy_pass / client_max_body_size /
# timeouts from this file.
server {
    listen 80;
    server_name notebook.apps.yaremenko.eu;
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Translation and smart formatting call Groq synchronously, batch by batch:
        # the default 60s read timeout is not enough for a long transcript.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /static {
        alias /opt/apps/notebook/static;
        expires 1d;
    }
}
